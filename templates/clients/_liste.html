{% if clients %}
<!-- Modal modification (contenu chargé dynamiquement par HTMX) -->
<dialog id="modal_modifier_client" class="modal">
    <div class="modal-box">
        <div id="modal-modifier-contenu">
            <!-- HTMX injecte le formulaire ici -->
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>Fermer</button>
    </form>
</dialog>

<!-- Liste des clients -->
<div id="liste-clients">
    <div class="overflow-x-auto">
        <table class="table table-zebra bg-base-100 rounded-xl shadow">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Adresse</th>
                    <th>Téléphone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr id="client-{{ client.id }}">
                    <td>{{ client.id }}</td>
                    <td class="font-medium">{{ client.nom }}</td>
                    <td>{{ client.email }}</td>
                    <td>{{ client.adresse }}</td>
                    <td>{{ client.telephone or "—" }}</td>
                    <td>
                        <button class="btn btn-warning btn-xs" hx-get="/clients/{{ client.id }}/modifier"
                            hx-target="#modal-modifier-contenu" hx-swap="innerHTML"
                            onclick="modal_modifier_client.showModal()">
                            Modifier
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% else %}
<div class="alert alert-info">
    <span>Aucun client pour l'instant. Ajoutez-en un !</span>
</div>
{% endif %}
