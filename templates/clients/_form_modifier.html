<h3 class="text-lg font-bold mb-4">Modifier {{ client.nom }}</h3>

<form hx-put="/clients/{{ client.id }}"
      hx-target="#liste-clients"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) modal_modifier_client.close()">

    <div class="form-control mb-3">
        <label class="label"><span class="label-text">Nom</span></label>
        <input name="nom" type="text" value="{{ client.nom }}"
               class="input input-bordered" required>
    </div>

    <div class="form-control mb-3">
        <label class="label"><span class="label-text">Email</span></label>
        <input name="email" type="email" value="{{ client.email }}"
               class="input input-bordered" required>
    </div>

    <div class="form-control mb-3">
        <label class="label"><span class="label-text">Téléphone</span></label>
        <input name="telephone" type="text" value="{{ client.telephone or '' }}"
               class="input input-bordered">
    </div>

    <div class="form-control mb-4">
        <label class="label"><span class="label-text">Adresse</span></label>
        <input name="adresse" type="text" value="{{ client.adresse or '' }}"
               class="input input-bordered">
    </div>

    <div class="modal-action">
        <button type="button" onclick="modal_modifier_client.close()"
                class="btn btn-ghost">Annuler</button>
        <button type="submit" class="btn btn-warning">Enregistrer</button>
    </div>
</form>
